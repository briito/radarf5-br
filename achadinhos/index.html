<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar F5 Shop | Achadinhos e Ofertas</title>
  <meta name="description" content="Entre nos grupos de WhatsApp do Radar F5 Shop e receba achadinhos e ofertas selecionados da Shopee, TikTok Shop, Mercado Livre e Amazon.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Radar F5 Shop | Achadinhos e Ofertas">
  <meta property="og:description" content="Grupos de WhatsApp com achadinhos e ofertas selecionados todos os dias.">
  <meta property="og:url" content="https://radarf5.com.br/achadinhos/">
  <meta property="og:image" content="https://radarf5.com.br/achadinhos/logo-shop.webp">
  <link rel="canonical" href="https://radarf5.com.br/achadinhos/">
  <!-- Caminhos relativos: funcionam abrindo local e no site (use sempre /achadinhos/ com barra final) -->
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

  <div class="bio-wrapper">
    <header class="profile">
      <div class="brand-header">
        <img src="/achadinhos/logo-shop.webp" alt="Logo Radar F5 Shop" class="brand-logo">
        <h1>Radar F5 Shop</h1>
      </div>
      <p class="bio">Radar de Ofertas</p>
    </header>

    <main class="links-container">

      <!-- ============ BOTÃO 1: GRUPOS VIP NO WHATSAPP ============
           Para adicionar o 4º grupo: copie um <a class="sub-link"> abaixo e troque ícone, nome, link e data-track. -->
      <section class="accordion-item">
        <button type="button" class="accordion-trigger highlight" id="acc-grupos-btn" aria-expanded="false"
          aria-controls="acc-grupos-panel" data-track="abrir_grupos_vip">
          <i class="ph ph-whatsapp-logo" aria-hidden="true"></i>
          <span class="link-text">Grupo VIP no WhatsApp<small>(Gratuito) Receba somente ofertas do seu interesse</small></span>
          <i class="ph ph-caret-down accordion-chevron" aria-hidden="true"></i>
        </button>
        <div class="accordion-panel" id="acc-grupos-panel" role="region" aria-labelledby="acc-grupos-btn">
          <div class="accordion-inner">
            <div class="accordion-list">

              <a href="https://chat.whatsapp.com/IBd0xJejhm6Cu4XYJFIGou" target="_blank" rel="noopener noreferrer"
                class="sub-link" data-group="casa-cozinha" data-track="grupo_casa_cozinha">
                <i class="ph ph-cooking-pot" aria-hidden="true"></i>
                <span class="sub-link-text">Casa e Cozinha</span>
                <i class="ph ph-whatsapp-logo" aria-hidden="true"></i>
              </a>

              <a href="https://chat.whatsapp.com/KUv7R1PlitZ6AGfAqa71PC" target="_blank" rel="noopener noreferrer"
                class="sub-link" data-group="tecnologia-eletronicos" data-track="grupo_tecnologia_eletronicos">
                <i class="ph ph-laptop" aria-hidden="true"></i>
                <span class="sub-link-text">Tecnologia e Eletrônicos</span>
                <i class="ph ph-whatsapp-logo" aria-hidden="true"></i>
              </a>

              <a href="https://chat.whatsapp.com/D8Ig8v2XEDDFq84dXhTXj2" target="_blank" rel="noopener noreferrer"
                class="sub-link" data-group="acessorios-celular" data-track="grupo_acessorios_celular">
                <i class="ph ph-device-mobile" aria-hidden="true"></i>
                <span class="sub-link-text">Acessórios para Celular</span>
                <i class="ph ph-whatsapp-logo" aria-hidden="true"></i>
              </a>

            </div>
          </div>
        </div>
      </section>

      <!-- ============ BOTÃO 2: ACHADINHOS EM OFERTA (VITRINES) ============
           TROQUE cada href="#" pelo link da sua vitrine em cada plataforma. -->
      <section class="accordion-item">
        <button type="button" class="accordion-trigger" id="acc-vitrines-btn" aria-expanded="false"
          aria-controls="acc-vitrines-panel" data-track="abrir_vitrines">
          <i class="ph ph-fire" aria-hidden="true"></i>
          <span class="link-text">Achadinhos e Ofertas<small>Vitrine de descontos e promoções</small></span>
          <i class="ph ph-caret-down accordion-chevron" aria-hidden="true"></i>
        </button>
        <div class="accordion-panel" id="acc-vitrines-panel" role="region" aria-labelledby="acc-vitrines-btn">
          <div class="accordion-inner">
            <div class="accordion-list">

              <!-- TROQUE o link da vitrine da Shopee -->
              <a href="#" target="_blank" rel="noopener noreferrer" class="sub-link" data-track="vitrine_shopee">
                <i class="ph ph-shopping-bag" aria-hidden="true"></i>
                <span class="sub-link-text">Vitrine Shopee</span>
                <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
              </a>

              <!-- TROQUE o link da vitrine do Mercado Livre -->
              <a href="#" target="_blank" rel="noopener noreferrer" class="sub-link" data-track="vitrine_mercado_livre">
                <i class="ph ph-handshake" aria-hidden="true"></i>
                <span class="sub-link-text">Vitrine Mercado Livre</span>
                <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
              </a>

              <!-- TROQUE o link da vitrine do TikTok Shop -->
              <a href="#" target="_blank" rel="noopener noreferrer" class="sub-link" data-track="vitrine_tiktok_shop">
                <i class="ph ph-tiktok-logo" aria-hidden="true"></i>
                <span class="sub-link-text">Vitrine TikTok Shop</span>
                <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
              </a>

            </div>
          </div>
        </div>
      </section>

    </main>

    <footer>
      <p>© 2026 Radar F5 Shop. Todos os direitos reservados.</p>
      <nav class="legal-links" aria-label="Informações legais">
        <a href="../politica-de-privacidade.html">Política de Privacidade</a>
        <span aria-hidden="true"></span>
        <a href="../politica-de-cookies.html">Política de Cookies</a>
        <span aria-hidden="true"></span>
        <a href="../termos-de-uso.html">Termos de Uso</a>
        <span aria-hidden="true"></span>
        <a href="../termos-de-uso.html#afiliados">Divulgação de afiliados</a>
      </nav>
    </footer>
  </div>

  <script src="../script.js"></script>
</body>

</html>
